# ==============================================================================
# Store Management System - Fastify Backend Docker Compose
# ==============================================================================
# Stage 1: Fastify API Process Foundation
# Stage 2: PostgreSQL 17 Persistence Layer
# Note: Redis / BullMQ will be introduced in Stage 4.
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: store-management-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-store_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastify-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-management-fastify-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_PREFIX=${API_PREFIX:-/api/v1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-store_management}?schema=public
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_CONNECTION_TIMEOUT_MS=${DB_CONNECTION_TIMEOUT_MS:-5000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    name: store-management-postgres-data
