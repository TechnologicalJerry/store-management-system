name: CI / CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastify-server
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fastify-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  typecheck-and-test:
    name: Type Checking & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastify-server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: store_management_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d store_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fastify-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/store_management_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long!!
          COOKIE_SECRET: test-cookie-secret-minimum-32-chars-long!!
        run: npm run test

  build:
    name: Production Build
    needs: [code-quality, typecheck-and-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastify-server
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fastify-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application (TypeScript Build)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/server.js || exit 1
          test -f dist/worker.js || exit 1
          test -f dist/app.js || exit 1

  docker-build:
    name: Docker Container Build
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image (Dry-Run / Validation)
        uses: docker/build-push-action@v5
        with:
          context: ./fastify-server
          file: ./fastify-server/Dockerfile
          push: false
          tags: store-management-fastify:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
